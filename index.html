<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>資料庫即時銷售圖表</title>
    <!-- 關鍵：必須引入 Chart.js 畫圖工具 -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        canvas { max-width: 800px; margin-top: 20px; }
    </style>
</head>
<body>
    <h1>資料庫即時銷售圖表</h1>
    <p>按下 F5 重新整理，即可抓取 MySQL 最新資料。</p>
    
    <canvas id="myChart" width="800" height="400"></canvas>

    <script>
        // 👇👇👇 請把引號裡面的網址，換成您最新的 GAS 網頁應用程式網址 (.../exec)
        const apiUrl = 'https://script.google.com/macros/s/AKfycbwkUULgzVI5B-sCnC8tgMgQQB0A-_Q6_aye9j_EDDAbEihg87TOA8QPhtsLt-ooWZ0Q3g/exec';

        console.log("開始向 API 請求資料...");

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error("網路連線發生錯誤");
                return response.json();
            })
            .then(data => {
                console.log("✅ 成功抓到資料：", data);

                // 準備畫圖用的資料 (以 product_name 和 quantity 為例)
                const labels = data.map(item => item.product_name);
                const quantities = data.map(item => parseInt(item.quantity));

                // 開始畫長條圖
                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '銷售數量',
                            data: quantities,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    }
                });
            })
            .catch(error => {
                console.error('❌ 抓取或畫圖失敗:', error);
            });
    <script>
        // 👇👇👇 這裡一樣填入你剛剛那個成功的 GAS API 網址
        const apiUrl = 'https://script.google.com/macros/s/AKfycbwkUULgzVI5B-sCnC8tgMgQQB0A-_Q6_aye9j_EDDAbEihg87TOA8QPhtsLt-ooWZ0Q3g/exec';

        console.log("開始向 API 請求資料...");

        fetch(apiUrl)
            .then(response => {
                if (!response.ok) throw new Error("網路連線發生錯誤");
                return response.json();
            })
            .then(data => {
                // 1. 將相同商品的銷售數量進行加總 (分類統計)
                const salesSummary = {};
                data.forEach(item => {
                    const name = item.product_name;
                    const qty = parseInt(item.quantity) || 0;
                    
                    if (salesSummary[name]) {
                        salesSummary[name] += qty; // 如果商品已存在，數量累加
                    } else {
                        salesSummary[name] = qty;  // 如果是新商品，建立第一筆數量
                    }
                });

                // 2. 提取出 X 軸 (商品名稱) 和 Y 軸 (總數量) 給圖表使用
                const labels = Object.keys(salesSummary);
                const quantities = Object.values(salesSummary);

                // 3. 畫出漂亮的長條圖
                const ctx = document.getElementById('myChart').getContext('2d');
                new Chart(ctx, {
                    type: 'bar',
                    data: {
                        labels: labels,
                        datasets: [{
                            label: '總銷售數量',
                            data: quantities,
                            backgroundColor: 'rgba(54, 162, 235, 0.5)',
                            borderColor: 'rgba(54, 162, 235, 1)',
                            borderWidth: 1
                        }]
                    }
                });
            })
            .catch(error => {
                console.error('❌ 抓取或畫圖失敗:', error);
            });
    </script>
</body>
</html>
